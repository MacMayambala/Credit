{% load static %}

<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Identity | MAC Tech</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-cobalt: #1632af;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.97);
            border: 1px solid rgba(22, 50, 175, 0.1);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(12px);
        }

        .method-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid transparent;
        }

        .method-card:hover {
            transform: translateY(-6px);
            border-color: var(--brand-cobalt);
            box-shadow: 0 15px 35px rgba(22, 50, 175, 0.15);
        }

        .method-card.active {
            border-color: var(--brand-cobalt);
            background: rgba(22, 50, 175, 0.03);
        }

        .icon-bg {
            width: 58px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
        }

        .logo-text {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(90deg, #1632af, #2a4ad8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6 col-xl-5">

            <div class="auth-card p-4 p-md-5">
                
                <!-- Header -->
                <div class="text-center mb-5">
                    <div class="d-inline-flex align-items-center gap-2 mb-3">
                        <i class="bi bi-shield-lock-fill fs-1" style="color: var(--brand-cobalt);"></i>
                        <span class="logo-text">MAC Tech</span>
                    </div>
                    <h3 class="fw-bold mb-2">Verify Your Identity</h3>
                    <p class="text-muted">
                        Choose a verification method to continue
                    </p>
                </div>

                <!-- Messages -->
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{% if message.tags == 'error' %}danger{% elif message.tags == 'success' %}success{% else %}info{% endif %} alert-dismissible fade show shadow-sm" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="POST">
                    {% csrf_token %}

                    <div class="d-grid gap-3">

                        <!-- Email Option -->
                        <button type="submit" name="method" value="email" 
                                class="method-card btn border-0 text-start p-4 bg-white shadow-sm">
                            <div class="d-flex align-items-center gap-4">
                                <div class="icon-bg bg-primary bg-opacity-10">
                                    <i class="bi bi-envelope-fill fs-3 text-primary"></i>
                                </div>
                                <div class="flex-grow-1">
                                    <h6 class="fw-semibold mb-1">Email Verification</h6>
                                    <p class="text-muted mb-0 small">
                                        Receive a 6-digit code via email
                                    </p>
                                </div>
                                <i class="bi bi-chevron-right text-muted"></i>
                            </div>
                        </button>

                        <!-- Authenticator App Option -->
                        <button type="submit" name="method" value="app" 
                                class="method-card btn border-0 text-start p-4 bg-white shadow-sm">
                            <div class="d-flex align-items-center gap-4">
                                <div class="icon-bg bg-success bg-opacity-10">
                                    <i class="bi bi-phone-fill fs-3 text-success"></i>
                                </div>
                                <div class="flex-grow-1">
                                    <h6 class="fw-semibold mb-1">Authenticator App</h6>
                                    <p class="text-muted mb-0 small">
                                        Use Google Authenticator or similar app
                                    </p>
                                </div>
                                <i class="bi bi-chevron-right text-muted"></i>
                            </div>
                        </button>

                    </div>
                </form>

                <!-- Footer Links -->
                <div class="text-center mt-5">
                    <a href="{% url 'login' %}" class="text-muted text-decoration-none small">
                        <i class="bi bi-arrow-left me-1"></i> Back to Login
                    </a>
                </div>
            </div>

            <div class="text-center mt-4">
                <p class="text-muted small mb-0">
                    &copy; 2026 MAC Technologies • Secure Banking System
                </p>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
