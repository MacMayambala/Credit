{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-md-10 col-lg-7 col-xl-5">
        
        <!-- Login Card -->
        <div class="text-center mb-4">
            <div class="brand-logo mx-auto mb-3" style="
                width: 70px; 
                height: 70px; 
                background: linear-gradient(135deg, var(--brand-cobalt), #3b82f6); 
                color: white; 
                border-radius: 18px; 
                display: flex; 
                align-items: center; 
                justify-content: center;
                font-size: 2rem;
                box-shadow: 0 10px 20px rgba(22, 50, 175, 0.2);">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h2 class="fw-bold" style="color: var(--text-primary); letter-spacing: -0.8px;">MAC FinTech</h2>
            <p class="text-secondary small">Authorized Personnel Access Only</p>
        </div>

        <div class="p-1">
            <form method="POST" action="{% url 'login' %}" novalidate>
                {% csrf_token %}

                <!-- Username -->
                <div class="mb-3">
                    <label class="form-label small fw-bold text-uppercase" style="letter-spacing: 0.5px; color: var(--text-secondary);">
                        Username or Email
                    </label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 border-2" style="border-color: var(--border-color);">
                            <i class="bi bi-person text-muted"></i>
                        </span>
                        <input type="text" 
                               name="username" 
                               class="form-control form-control-lg border-start-0 border-2" 
                               style="border-color: var(--border-color); font-size: 1rem;"
                               placeholder="Enter your username" 
                               required autofocus>
                    </div>
                </div>

                <!-- Password -->
                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <label class="form-label small fw-bold text-uppercase" style="letter-spacing: 0.5px; color: var(--text-secondary);">
                            Security Password
                        </label>
                        <a href="{% url 'password_reset' %}" class="small mb-2 text-decoration-none fw-bold" style="color: var(--brand-cobalt);">Forgot?</a>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 border-2" style="border-color: var(--border-color);">
                            <i class="bi bi-lock text-muted"></i>
                        </span>
                        <input type="password" 
                               name="password" 
                               id="passwordInput" 
                               class="form-control form-control-lg border-start-0 border-end-0 border-2" 
                               style="border-color: var(--border-color); font-size: 1rem;"
                               placeholder="••••••••" 
                               required>
                        <span class="input-group-text bg-transparent border-start-0 border-2" 
                              style="border-color: var(--border-color); cursor: pointer;" 
                              onclick="togglePassword()">
                            <i class="bi bi-eye text-muted" id="toggleIcon"></i>
                        </span>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-3 fw-bold rounded-3 shadow-sm" 
                        style="background-color: var(--brand-cobalt); border: none;">
                    SIGN IN TO PORTAL <i class="bi bi-arrow-right-short ms-1"></i>
                </button>

                <div class="text-center mt-4 pt-3 border-top" style="border-color: var(--border-color) !important;">
                    <p class="small text-muted mb-0">
                        Confidential Infrastructure. <a href="#" class="text-decoration-none fw-bold" style="color: var(--brand-cobalt);">System Support</a>
                    </p>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function togglePassword() {
        const input = document.getElementById('passwordInput');
        const icon = document.getElementById('toggleIcon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('bi-eye', 'bi-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.replace('bi-eye-slash', 'bi-eye');
        }
    }
</script>

<style>
    /* Styling for focus states within the input groups */
    .input-group:focus-within .input-group-text,
    .input-group:focus-within .form-control {
        border-color: var(--brand-cobalt) !important;
    }
    
    .form-control:focus {
        box-shadow: none;
    }

    /* Custom sizing for the input groups */
    .input-group-text {
        padding-left: 1.2rem;
        padding-right: 1.2rem;
    }
</style>
{% endblock %}
