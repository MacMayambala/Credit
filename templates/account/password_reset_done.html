{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-8 col-lg-6 text-center">
        <!-- Success Animation/Icon Container -->
        <div class="mb-4">
            <div class="rounded-circle d-inline-flex align-items-center justify-content-center mb-4 shadow-sm" 
                 style="width: 100px; height: 100px; background: #ecfdf5; border: 2px solid #10b981;">
                <i class="bi bi-envelope-check-fill display-4" style="color: #10b981;"></i>
            </div>
        </div>

        <h2 class="fw-bold mb-3" style="color: var(--text-primary); letter-spacing: -0.5px;">
            Check your Inbox
        </h2>
        
        <p class="text-secondary mx-auto mb-5" style="max-width: 400px; line-height: 1.6;">
            We've sent a recovery link to your work email. Please click the link in that email to reset your MAC Tech system password.
        </p>

        <!-- Informational Note -->
        <div class="p-3 rounded-3 mb-5" style="background: var(--hover-bg); border: 1px dashed var(--border-color);">
            <p class="small text-muted mb-0">
                <i class="bi bi-info-circle me-2"></i>
                Don't see the email? Check your <strong>Spam</strong> or <strong>Junk</strong> folder.
            </p>
        </div>

        <!-- Action Button -->
        <a href="{% url 'login' %}" class="btn btn-outline-primary px-5 py-3 fw-bold rounded-3" 
           style="border-color: var(--brand-cobalt); color: var(--brand-cobalt); border-width: 2px;">
            <i class="bi bi-arrow-left me-2"></i> BACK TO SIGN IN
        </a>
    </div>
</div>

<style>
    /* Subtle bounce effect for the icon to make it feel dynamic */
    .bi-envelope-check-fill {
        animation: subtleBounce 2s infinite ease-in-out;
    }

    @keyframes subtleBounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
    }
</style>
{% endblock %}
