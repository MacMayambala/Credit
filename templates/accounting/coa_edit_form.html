{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="d-flex align-items-center mb-4">
            <a href="{% url 'chart_of_accounts' %}" class="btn btn-light rounded-circle me-3">
                <i class="bi bi-arrow-left"></i>
            </a>
            <h2 class="fw-bold mb-0">Edit Account: <span style="color: var(--brand-cobalt);">{{ account.code }}</span></h2>
        </div>

        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-secondary text-uppercase">Account Code</label>
                        <input type="text" name="code" value="{{ account.code }}" 
                               class="form-control form-control-lg border-color bg-light" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-secondary text-uppercase">Account Name</label>
                        <input type="text" name="name" value="{{ account.name }}" 
                               class="form-control form-control-lg border-color" required>
                    </div>

                    <!-- Category -->
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-secondary text-uppercase">Category</label>
                        <select name="category" class="form-select form-select-lg border-color" required>
                            <option value="" selected disabled>Select Category</option>
                            {% for val, label in account_types %}
                                <option value="{{ val }}">{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-bold text-secondary text-uppercase">Description</label>
                        <textarea name="description" class="form-control border-color" rows="3">{{ account.description }}</textarea>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary py-3 fw-bold rounded-3 shadow-sm" 
                                style="background-color: var(--brand-cobalt); border: none;">
                            <i class="bi bi-save me-2"></i> UPDATE CHANGES
                        </button>
                        <a href="{% url 'chart_of_accounts' %}" class="btn btn-link text-secondary text-decoration-none">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
