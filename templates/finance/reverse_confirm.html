{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-danger">
                <div class="card-header bg-danger text-white">
                    <h5 class="mb-0">Confirm Transaction Reversal</h5>
                </div>
                <div class="card-body">
                    <p>Are you sure you want to reverse the following transaction?</p>
                    <table class="table table-sm">
                        <tr>
                            <th>ID:</th>
                            <td>#{{ txn.id }}</td>
                        </tr>
                        <tr>
                            <th>Type:</th>
                            <td>{{ txn.get_type_display }}</td>
                        </tr>
                        <tr>
                            <th>Amount:</th>
                            <td><strong>{{ txn.amount }}</strong></td>
                        </tr>
                        <tr>
                            <th>Date:</th>
                            <td>{{ txn.timestamp }}</td>
                        </tr>
                    </table>

                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="reason" class="form-label">Reason for reversal:</label>
                            <textarea name="reason" id="reason" class="form-control" required placeholder="e.g., Data entry error"></textarea>
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'member_profile' txn.member.id %}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-danger">Confirm Reversal</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
