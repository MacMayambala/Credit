{% extends 'base.html' %}
{% load humanize %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <div class="bg-danger bg-opacity-10 text-danger rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 80px; height: 80px;">
                            <i class="bi bi-dash-circle fs-1"></i>
                        </div>
                        <h3 class="fw-bold">Savings Withdrawal</h3>
                        <p class="text-muted">Member: {{ member.first_name }} {{ member.last_name }}</p>
                    </div>

                    <div class="alert alert-light border d-flex justify-content-between align-items-center mb-4">
                        <span class="small text-muted fw-bold text-uppercase">Available Balance</span>
                        <span class="fw-bold text-dark">UGX {{ savings.balance|floatformat:0|intcomma }}</span>
                    </div>

                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Amount to Withdraw (UGX)</label>
                            <div class="input-group input-group-lg">
                                <span class="input-group-text bg-white border-end-0 text-muted">UGX</span>
                                <input type="number" name="amount" class="form-control border-start-0 ps-0" placeholder="0.00" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold">Reference / Reason</label>
                            <input type="text" name="reference" class="form-control" placeholder="e.g. Personal Use, Medical bill">
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-danger btn-lg rounded-pill py-3 fw-bold shadow-sm">
                                Confirm Withdrawal
                            </button>
                            <a href="{% url 'member_profile' member.id %}" class="btn btn-link text-muted text-decoration-none">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
