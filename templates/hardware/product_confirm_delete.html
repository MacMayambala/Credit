{% extends 'base.html' %}

{% block title %}Delete Product | MAC Technologies{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="content-card text-center">
            <i class="bi bi-exclamation-triangle fs-1 text-warning d-block mb-3"></i>
            <h4 class="fw-bold mb-3">Delete Product?</h4>
            <p class="text-muted">Are you sure you want to delete "{{ object.name }}"?</p>
            <p class="text-danger small">This will also delete all associated stock transactions and sales history.</p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-2 mt-3">
                    <button type="submit" class="btn btn-danger rounded-pill px-4">Yes, Delete</button>
                    <a href="{% url 'hardware:product_list' %}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
