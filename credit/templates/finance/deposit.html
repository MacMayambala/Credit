{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Record Cash Deposit</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Select Member</label>
                            <select name="member" class="form-select" required>
                                {% for m in members %}
                                <option value="{{ m.id }}">{{ m.first_name }} {{ m.last_name }} ({{ m.member_number }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Deposit Amount (UGX)</label>
                            <input type="number" name="amount" class="form-control" placeholder="e.g. 50000" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Confirm Deposit</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
